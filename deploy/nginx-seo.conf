# Include this file inside the HTTPS moralsqd.ru server block.

location = / {
    try_files /index.html =404;
}

location = /index.html {
    return 308 /;
}

location = /robots.txt {
    try_files /robots.txt =404;
    default_type text/plain;
    expires 1h;
}

location = /sitemap.xml {
    try_files /sitemap.xml =404;
    default_type application/xml;
    expires 1h;
}

location = /site.webmanifest {
    try_files /site.webmanifest =404;
    default_type application/manifest+json;
    expires 1h;
}

location = /og-moral-squad.png {
    try_files /og-moral-squad.png =404;
    expires 7d;
}

location = /icon-192.png {
    try_files /icon-192.png =404;
    expires 30d;
}

location = /icon-512.png {
    try_files /icon-512.png =404;
    expires 30d;
}

location = /apple-touch-icon.png {
    try_files /apple-touch-icon.png =404;
    expires 30d;
}
